<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="bostoncyberx"><title>bostoncyberx mark, animated</title>
<style>
  .s{stroke:#FF3B30;stroke-width:7.0;fill:none;stroke-dasharray:38.18;stroke-dashoffset:38.18}
  .a{animation:draw .82s cubic-bezier(.65,0,.35,1) .12s forwards}
  .b{animation:draw .82s cubic-bezier(.65,0,.35,1) .62s forwards}
  .node{fill:#FF3B30;opacity:0;transform-origin:32px 32px;
        animation:pulse 1.5s cubic-bezier(.2,.8,.2,1) 1.34s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pulse{0%{opacity:.9;transform:scale(.2)}45%{opacity:.18;transform:scale(2.5)}
    100%{opacity:0;transform:scale(3.4)}}
  @media(prefers-reduced-motion:reduce){
    .s{stroke-dashoffset:0;animation:none}.node{animation:none;opacity:0}}
</style><rect width="64" height="64" rx="14" fill="#0A0E1A"/><circle class="node" cx="32" cy="32" r="4"/>
<path class="s a" d="M18.5 18.5L45.5 45.5"/><path class="s b" d="M45.5 18.5L18.5 45.5"/></svg>
